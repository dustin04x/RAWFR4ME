[workspace]
resolver = "3"
members = [
    "crates/rawframe-core",
    "crates/rawframe-http",
    "crates/rawframe-proxy",
    "crates/rawframe-store",
    "crates/rawframe-repeater",
    "crates/rawframe-intruder",
    "crates/rawframe-analysis",
    "crates/rawframe-tui",
    "crates/rawframe-cli",
]
default-members = ["crates/rawframe-cli"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
rawframe-core = { path = "crates/rawframe-core" }
rawframe-http = { path = "crates/rawframe-http" }
rawframe-proxy = { path = "crates/rawframe-proxy" }
rawframe-store = { path = "crates/rawframe-store" }
rawframe-repeater = { path = "crates/rawframe-repeater" }
rawframe-intruder = { path = "crates/rawframe-intruder" }
rawframe-tui = { path = "crates/rawframe-tui" }

anyhow = "1.0"
futures-util = "0.3"
bytes = "1.10"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
httparse = "1.10"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

# WebSocket (M10)
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Persistence (M5)
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1.0"
tempfile = "3.27"

# TLS interception (M4)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
x509-parser = "0.16"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
flate2 = "1.1"
time = { version = "0.3", features = ["macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
